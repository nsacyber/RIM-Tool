site_name: RIM-Tool Docs
site_description: Create, sign, and verify Reference Integrity Manifests using the RIM-Tool.
site_url: https://nsacyber.github.io/RIM-Tool/
repo_url: https://github.com/nsacyber/rim-tool
repo_name: nsacyber/rim-tool
nav:
  - Home:
      - Home: index.md
      - About: about.md
  - Getting Started:
      - Getting Started: getting-started/index.md
      - Setup: getting-started/setup.md
  - Reference:
      - reference/index.md
      - Create: reference/create.md
      - Verify: reference/verify.md
      - Print: reference/print.md
      - Sign: reference/sign.md
      - Get: reference/get.md
  - RIM Formats:
      - RIMs/index.md
      - TCG PC Client RIM: RIMs/tcg-pc-client-rim.md
      - TCG Component RIM: RIMs/tcg-component-rim.md
      - CoSWID Tag: RIMs/coswid.md
      - CoRIM: RIMs/corim.md
      - Configuration:
        - RIMs/configuration-files.md
  - Background:
      - background/index.md
      - PC Firmware Validation: background/pc-rim.md
      - Component Firmware Validation: background/component-rim.md
      - Composite RIMs: background/composite-rim.md
theme:
  variant: classic
  icon:
    logo: material/wrench
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - toc.follow
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nsacyber/rim-tool
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
