name: RIM-Tool packaging
on:
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**/*.md'       # Ignores all Markdown files
      - '**/*.png'      # Ignores all PNG images
      - '**/*.jpg'      # Ignores all JPG images
      - 'mkdocs.yml'    # Ignores the MkDocs config
  workflow_dispatch:

jobs:
  # run the package script for RIM_tool
  Package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Update OS
        run: |
          sudo apt-get update 

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
 
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
 
      - name: Execute Gradle build
        run: |
          ./gradlew clean;
          ./gradlew buildRpm;
          ./gradlew buildDeb;

      - name: Archive RPM files
        uses: actions/upload-artifact@v7
        with:
          name: RPM_Files
          path: |
            build/distributions/*.rpm
          if-no-files-found: error

      - name: Archive DEB files
        uses: actions/upload-artifact@v7
        with:
          name: DEB_Files
          path: |
            build/distributions/*.deb
          if-no-files-found: error

      - name: JAR_Files
        uses: actions/upload-artifact@v7
        with: 
          name: JAR_Files
          path: build/libs/*.jar
          if-no-files-found: error

  # install the rim-tool packages on clean OS images and check that it runs
  Package_install:
    needs: Package_linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            artifact: DEB_Files
            install: apt-get update -qq && apt-get install -y -qq ./*.deb
          - image: rockylinux/rockylinux:9.8
            artifact: RPM_Files
            install: dnf install -y ./*.rpm

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install on ${{ matrix.image }} and run --help
        run: |
          docker run --rm -v "$PWD/dist:/dist" -w /dist/RIM-Tool/build/distributions ${{ matrix.image }} bash -c '
            set -e
            ${{ matrix.install }}
            cd /tmp
            rim --help > help.txt 2>&1 || { cat help.txt; echo "rim --help failed"; exit 1; }
            cat help.txt
            grep -q -- "--tcp" help.txt
          '