name: RIM-Tool packaging
on:
  push:
    paths-ignore:
      - '**/*.md'       # Ignores all Markdown files
      - '**/*.png'      # Ignores all PNG images
      - '**/*.jpg'      # Ignores all JPG images
      - 'mkdocs.yml'    # Ignores the MkDocs config
  workflow_dispatch:

jobs:
  # run the package script for RIM_tool
  Package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: directory setup
        run: |
          mkdir -p artifacts/jar
          mkdir -p artifacts/rpm
          mkdir -p artifacts/deb
          mkdir -p artifacts/win
      
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git curl nano cron

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Gradle user home
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build
        run: |    
          ./gradlew :clean :build
          cp build/libs/*.jar artifacts/jar/.

      - name: Run Gradle package
        run: |    
          ./gradlew :clean :buildRpm 
          cp build/distributions/*.rpm artifacts/rpm/.
          ./gradlew :clean :buildDeb 
          cp build/distributions/*.deb artifacts/deb/.

      - name: Archive RPM files
        uses: actions/upload-artifact@v7
        with:
          name: RPM_Files
          path: artifacts/rpm/*.rpm
          if-no-files-found: error

      - name: Archive DEB files
        uses: actions/upload-artifact@v7
        with:
          name: DEB_Files
          path: artifacts/deb/*.deb
          if-no-files-found: error

      - name: JAR_Files
        uses: actions/upload-artifact@v7
        with: 
          name: JAR_Files
          path: artifacts/jar/*.jar
          if-no-files-found: error

  # install the rim-tool packages on clean OS images and check that it runs
  Package_install_test:
    needs: Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:26.04
            artifact: DEB_Files
            install: cd /dist && apt-get update -qq  && apt-get install -y openjdk-25-jdk > /dev/null  && apt-get install -y -qq ./*.deb
          - image: rockylinux:9.9
            artifact: RPM_Files
            install: cd /dist && dnf install -y -q java-25-openjdk-devel > /dev/null && dnf install -y ./*.rpm

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install on ${{ matrix.image }} and run --help
        run: |
          docker run --rm -v "$PWD/dist:/dist" -w /dist/ ${{ matrix.image }} bash -c '
            set -e
            ${{ matrix.install }}
            cd /tmp
            rim --help > help.txt 2>&1 || { cat help.txt; echo "rim --help failed"; exit 1; }
            cat help.txt
            grep -q -- "SWID" help.txt
          '